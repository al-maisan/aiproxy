name: Bug report
description: Report a defect in aiproxy
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. For security issues,
        please use the private process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: aiproxy version
      description: Output of `aiproxy -version`.
      placeholder: aiproxy 0.1.0 (commit ..., built ...)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant configuration, with secrets redacted.
      render: toml
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (redact secrets).
      render: text
    validations:
      required: false
