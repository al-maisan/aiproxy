# aiproxy configuration.
#
# aiproxy fronts an OpenAI-compatible client and prefers the primary upstream
# for routed models. When the primary reports exhausted quota, the request is
# retried verbatim against the fallback. Unrouted models go straight to the
# fallback.

listen = "127.0.0.1:8787"

# Require "Authorization: Bearer <token>" from clients when set.
# client_token = ""

# Fallback-only request fields removed before calling the primary.
# Top-level keys must precede any [table].
strip_fields = ["provider", "route", "transforms", "models", "plugins", "session_id", "usage"]

[log]
level  = "info" # debug | info | warn | error
format = "text" # text | json

[server]
read_header_timeout          = "15s"
upstream_header_timeout      = "180s"
dial_timeout                 = "10s"
idle_conn_timeout            = "90s"
shutdown_timeout             = "15s"
max_body_bytes               = 67108864
fallback_on_connection_error = true

[upstreams.primary]
name       = "opencode-go"
chat_url   = "https://opencode.ai/zen/go/v1/chat/completions"
models_url = "https://opencode.ai/zen/go/v1/models"
# Key sources: literal:<v> | env:<VAR> | file:<path> | opencode-auth:<provider>
api_key = "opencode-auth:opencode-go"

[upstreams.fallback]
name       = "openrouter"
chat_url   = "https://openrouter.ai/api/v1/chat/completions"
models_url = "https://openrouter.ai/api/v1/models"
api_key    = "opencode-auth:openrouter"

[quota]
statuses = [402, 429]
# Deliberately specific: broad terms like "limit exceeded" also match
# context-length errors and would cause spurious fallbacks.
# Single-quoted literals avoid regex escaping.
patterns = [
  '(?i)\bquota\b',
  '(?i)usage limit',
  '(?i)usage-limit',
  '(?i)insufficient[_ ]?quota',
  '(?i)insufficient (funds|credits|balance)',
  '(?i)credit balance',
  '(?i)out of credits',
  '(?i)no (more )?credits',
  '(?i)monthly limit',
]

# A route makes a requested model prefer the primary. The fallback receives the
# original request unless `fallback` overrides the model id.
[[routes]]
requested = "~deepseek/deepseek-flash-latest"
primary   = "deepseek-v4.1-flash"

[[routes]]
requested = "z-ai/glm-5.3"
primary   = "glm-5.3"
